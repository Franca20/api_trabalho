<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrair dados do CSV</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <div class="topbar">
        <button id="menu-btn" class="hamburger" aria-label="Abrir menu">☰</button>
        <span class="logo">Extrair CSV</span>
    </div>
    <nav class="nav-menu" id="side-menu" aria-label="Menu principal">
        <button id="menu-close" class="menu-close" aria-label="Fechar menu">×</button>
        <a href="/">Motoristas a descarregar</a>
        <a href="/concluidos">Motoristas concluídos</a>
        <a href="/carregar">Motoristas a carregar</a>
        <a href="/qrcode">Gerar QR Code</a>
        <a href="/extrair-csv">Extrair CSV</a>
        <a href="https://github.com/Franca20/api_trabalho/blob/main/dicas_patio/bolsao.md" target="_blank" rel="noopener noreferrer">Dicas</a>
    </nav>
    <div class="menu-overlay" id="menu-overlay"></div>

    <div class="container">
        <div class="card">
            <label class="label-index">Enviar CSV para extração</label>
            <p class="status-message">Escolha seu arquivo CSV e extraia automaticamente os dados para visualização.</p>
            <input id="csv-file" class="input-index" type="file" accept=".csv">
            <div class="csv-action-row">
                <button id="extract-btn" class="btn-confirm" type="button">Extrair dados</button>
                <button id="clear-btn" class="btn-secondary" type="button">Limpar JSON</button>
                <span id="csv-status" class="status-message">Nenhum arquivo selecionado.</span>
            </div>
            <div id="csv-info" class="csv-result-info"></div>
            <div id="csv-table-container"></div>
        </div>
    </div>

    <script defer src="{{ url_for('static', filename='menu.js') }}"></script>
    <script defer src="{{ url_for('static', filename='extrair_csv.js') }}"></script>
</body>
</html>
