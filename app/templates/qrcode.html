<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar QR Code da LT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <div class="topbar">
        <button id="menu-btn" class="hamburger" aria-label="Abrir menu">☰</button>
        <span class="logo">Gerar QR Code LT</span>
    </div>
    <nav class="nav-menu" id="side-menu" aria-label="Menu principal">
        <button id="menu-close" class="menu-close" aria-label="Fechar menu">×</button>
        <a href="/">Motoristas a descarregar</a>
        <a href="/concluidos">Motoristas concluídos</a>
        <a href="/carregar">Motoristas a carregar</a>
        <a href="/mapa bolsao">Mapa Bolsão</a>
        <a href="/qrcode">Gerar QR Code</a>
        <a href="/extrair-csv">Extrair CSV</a>
        <a href="https://github.com/Franca20/api_trabalho/blob/main/dicas_patio/bolsao.md" target="_blank" rel="noopener noreferrer">Dicas</a>
    </nav>
    <div class="menu-overlay" id="menu-overlay"></div>

    <div class="container">
        <div class="card qr-card">
            <label class="label-index">Gerar QR Code</label>
            <p class="status-message">Digite a LT do motorista e o código será gerado automaticamente para o coletor.</p>

            <div class="qr-form">
                <input id="lt-input" class="input-index" type="text" placeholder="Ex.: LT0Q7E02AZ7X1" autocomplete="off" spellcheck="false">
                <div class="qr-actions">
                    <button id="gerar-btn" class="btn-confirm" type="button">Gerar QR Code</button>
                    <button id="copiar-btn" class="btn-secondary" type="button">Copiar LT</button>
                </div>
            </div>

            <div id="qr-status" class="status-message">Aguardando LT...</div>
            <div class="qr-preview">
                <div id="lt-display" class="lt-display">LT</div>
                <img id="qr-image" class="qr-image" alt="QR Code da LT" hidden>
            </div>
        </div>
    </div>

    <script defer src="{{ url_for('static', filename='menu.js') }}"></script>
    <script defer src="{{ url_for('static', filename='qrcode.js') }}"></script>
</body>
</html>
