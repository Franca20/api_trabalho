<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoristas a descarregar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <div class="topbar">
        <button id="menu-btn" class="hamburger" aria-label="Abrir menu">☰</button>
        <span class="logo">Consulta descarregamento</span>
    </div>
    <nav class="nav-menu" id="side-menu" aria-label="Menu principal">
        <button id="menu-close" class="menu-close" aria-label="Fechar menu">×</button>
        <a href="/">Motoristas a descarregar</a>
        <a href="/concluidos">Motoristas concluídos</a>
        <a href="/carregar">Motoristas a carregar</a>
    </nav>
    <div class="menu-overlay" id="menu-overlay"></div>

    <div class="container">
        <div class="card">
            <label class="label-index">Motoristas a descarregar</label>
            <p class="status-message">Busque por nome, placa ou estação e marque os que já foram concluídos.</p>
            <input id="consulta" class="input-index" type="text" placeholder="Digite o nome do motorista ou placa">
            <a class="secondary-link" href="/concluidos">Ver motoristas concluídos</a>
            <div id="status-descarregar" class="status-message">Carregando...</div>
            <div id="lista-descarregar" class="items-list"></div>
        </div>
    </div>

    <script defer src="{{ url_for('static', filename='api_descarregamento.js') }}"></script>
    <script defer src="{{ url_for('static', filename='menu.js') }}"></script>
</body>
</html>
