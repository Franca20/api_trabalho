<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bolsao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bolsao.css') }}">
</head>
<body>
    <div class="container-1" >
        <div class="row" style="background-color: lightgray;">

            <!-- Botões gerados pelo Jinja -->
            <div class="col all-btn vagasContainer">
            {% for i in range(33) %}
                <button type="button"
                        class="btn btn-outline-primary infoBtn"
                        data-index="{{ i + 1 }}"
                        data-title="Vaga {{ i + 1 }}"
                        data-body="Detalhes da vaga {{ i + 1 }} — local, requisitos, salário, etc.">
                Vaga {{ i + 1 }}
                </button>
            {% endfor %}
            </div>
            
            <div class="col" style="background-color:  aqua;">
            </div>
            <div class="col" style="background-color: aqua;">
            </div>
            
            <!-- Botões gerados pelo Jinja -->
            <div class="col all-btn vagasContainer">
            {% for i in range(33, 67) %}
                <button type="button"
                        class="btn btn-outline-primary infoBtn"
                        data-index="{{ i + 1 }}"
                        data-title="Vaga {{ i + 1 }}"
                        data-body="Detalhes da vaga {{ i + 1 }} — local, requisitos, salário, etc.">
                Vaga {{ i + 1 }}
                </button>
            {% endfor %}
            </div>

            <!-- Modal único (reutilizável) -->
            <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="infoModalLabel">Título</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="card">
                    <div class="card-body">
                        <p class="card-text" id="infoModalBody">Conteúdo</p>
                    </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div id="infoModalActions"></div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
                </div>
            </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='scripts/mapa_bolsao.js') }}"></script>
</body>
</html>
