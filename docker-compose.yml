version: "3.9"

services:
  web:
    build: .
    container_name: api_trabalho_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      APP_DATA_DIR: /tmp/api_trabalho_data
      LIMPAR_CONCLUIDOS_SENHA: ${LIMPAR_CONCLUIDOS_SENHA}
    volumes:
      - .:/app:ro
      - api_data:/tmp/api_trabalho_data
    restart: unless-stopped

volumes:
  api_data: